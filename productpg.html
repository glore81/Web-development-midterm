<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODANOVA - Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="productpg.css">
    <link rel="icon" type="png" href="logo.png">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light custom-navbar py-3">
        <div class="container">
            <a class="navbar-brand fw-bold tracking-wide" href="index.html">MODANOVA</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="catalogue.html">Catalogue</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <div class="nav-icons d-flex align-items-center gap-3">
                    <a href="#" class="nav-icon" title="Profile">
                        <img src="user.png" alt="User profile">
                    </a>
                    <a href="#" class="nav-icon" title="Cart">
                        <img src="basket.png" alt="Basket">
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <main class ="container page">
        <div class ="top">
            <p>
                Home / Shop / <b>Basic cotton tee</b>
            </p>
            <div class="search">
                <input type="text" placeholder="Search products">
                <button>⌕</button>
            </div>
        </div>
        <div class="product">
            <div class="photos">
                <img src ="blacktshirt1.jpg" class="photo" alt="Basic cotton tee">
                <img src ="blacktshirt2.jpg" class="photo" alt="Basic cotton tee">
            </div>
            <div class="info">
                <p>ESSENTIALS</p>
                <h1>Basic cotton tee</h1>
                <p class="price">20$</p>
                <p>A soft, midweight cotton tee with a clean crew neck
            and a relaxed fit. Easy to layer, made for every day.</p>
            
            <p>Colour</p>
            <div class ="colour">
                <div class="white"></div>
                <div class="gray"></div>
                <div class="black"></div>
            </div>
            
            <p>Size</p>
            <div class="size">
                <button>S</button>
                <button class ="selected">M</button>
                <button>L</button>
                <button>XL</button>
            </div>
            <p class = "delivery">Free delivery over 50$</p>
            <p class = "delivery">Easy returns within 14days</p>
            <div class="basket">
                <button class="add">Add to basket</button>
                <button class="heart">♡</button>
            </div>
        </div>
    </main>
</body>
</html>
